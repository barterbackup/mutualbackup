name: ci

on:
  push:
  pull_request:

jobs:
  static-artifacts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - name: Build the locked static CLI and daemon artifacts
        run: nix flake check --print-build-logs

  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.91.0
          components: clippy,rustfmt
      - run: bash scripts/docker-lab-safety-test.sh
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --all-targets --locked

  packaged-git-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - name: Build the installed runtime and optional Git alias
        run: |
          nix build .#default -o result-runtime
          nix build .#git-command -o result-git
      - name: Provision disposable Btrfs filesystem
        run: |
          sudo apt-get update
          sudo apt-get install -y btrfs-progs
          truncate -s 2G /tmp/mutualbackup-package-ci.btrfs
          sudo mkfs.btrfs -q -f /tmp/mutualbackup-package-ci.btrfs
          sudo mkdir -p /mnt/mutualbackup-package-ci
          sudo mount -o loop,user_subvol_rm_allowed /tmp/mutualbackup-package-ci.btrfs /mnt/mutualbackup-package-ci
          sudo chown "$USER":"$USER" /mnt/mutualbackup-package-ci
      - name: Prove packaged Git interoperability without ambient Git
        run: |
          nix develop -c bash -c 'python3 scripts/packaged-git-smoke.py \
            --bin-dir "$PWD/result-runtime/bin" \
            --alias-dir "$PWD/result-git/bin" \
            --stock-git "$(command -v git)" \
            --reflink-root /mnt/mutualbackup-package-ci'
      - name: Retain failed daemon diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: packaged-git-diagnostics
          path: /mnt/mutualbackup-package-ci/mb-package-git-*/daemon.log
          if-no-files-found: ignore
      - name: Unmount disposable filesystem
        if: always()
        run: |
          if mountpoint -q /mnt/mutualbackup-package-ci; then
            sudo umount /mnt/mutualbackup-package-ci
          fi

  native-git-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.91.0
          components: clippy
      - name: Provision disposable Btrfs filesystem
        run: |
          sudo apt-get update
          sudo apt-get install -y btrfs-progs iproute2 iptables procps util-linux
          truncate -s 6G /tmp/mutualbackup-git-ci.btrfs
          sudo mkfs.btrfs -q -f /tmp/mutualbackup-git-ci.btrfs
          sudo mkdir -p /mnt/mutualbackup-git-ci
          sudo mount -o loop,user_subvol_rm_allowed /tmp/mutualbackup-git-ci.btrfs /mnt/mutualbackup-git-ci
          sudo chown "$USER":"$USER" /mnt/mutualbackup-git-ci
      - name: Run the complete native Git acceptance suite
        env:
          MUTUALBACKUP_REFLINK_TEST_ROOT: /mnt/mutualbackup-git-ci
          MUTUALBACKUP_TEST_LOG_ROOT: ${{ github.workspace }}/git-peer-logs
        run: |
          set -o pipefail
          git rev-parse HEAD
          rustc --version --verbose
          bash scripts/git-linux-acceptance.sh 2>&1 | tee git-linux-acceptance.log
      - name: Collect peer diagnostics before filesystem cleanup
        if: always()
        run: |
          python3 - <<'PY'
          import os
          import shutil
          from pathlib import Path
          os.umask(0o077)
          root = Path("/mnt/mutualbackup-git-ci")
          names = {"p0.log", "p1.log", "p2.log", "p3.log", "p4.log",
                   "recovered.log", "storage-recovered.log", "outsider.log"}
          for source in root.glob("process-*/*.log"):
              if source.name in names and not source.is_symlink() and source.is_file():
                  destination = Path("git-peer-logs") / source.relative_to(root)
                  destination.parent.mkdir(parents=True, exist_ok=True, mode=0o700)
                  shutil.copyfile(source, destination)
          PY
      - name: Retain native Git qualification diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-git-qualification
          path: |
            git-linux-acceptance.log
            git-peer-logs/
          if-no-files-found: ignore
      - name: Remove disposable filesystem
        if: always()
        run: |
          if mountpoint -q /mnt/mutualbackup-git-ci; then
            sudo umount /mnt/mutualbackup-git-ci
          fi
          rm -f /tmp/mutualbackup-git-ci.btrfs

  port-mapping-acceptance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.91.0
      - run: sudo apt-get update && sudo apt-get install -y iproute2
      - run: bash scripts/port-mapping-acceptance.sh

  reflink-acceptance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.91.0
      - name: Provision disposable Btrfs filesystem
        run: |
          sudo apt-get update
          sudo apt-get install -y btrfs-progs iproute2 iptables procps util-linux
          truncate -s 2G /tmp/mutualbackup-ci.btrfs
          sudo mkfs.btrfs -q -f /tmp/mutualbackup-ci.btrfs
          sudo mkdir -p /mnt/mutualbackup-ci
          sudo mount -o loop,user_subvol_rm_allowed /tmp/mutualbackup-ci.btrfs /mnt/mutualbackup-ci
          sudo chown "$USER":"$USER" /mnt/mutualbackup-ci
      - name: Run mandatory reflink acceptance suite
        env:
          MUTUALBACKUP_REFLINK_TEST_ROOT: /mnt/mutualbackup-ci
        run: bash scripts/reflink-acceptance.sh

  private-tor-acceptance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - name: Provision disposable Btrfs filesystem
        run: |
          truncate -s 6G /tmp/mutualbackup-tor-ci.btrfs
          nix develop .#private-tor -c bash -c \
            'sudo "$(command -v mkfs.btrfs)" -q -f /tmp/mutualbackup-tor-ci.btrfs'
          sudo mkdir -p /mnt/mutualbackup-tor-ci
          sudo mount -o loop,user_subvol_rm_allowed \
            /tmp/mutualbackup-tor-ci.btrfs /mnt/mutualbackup-tor-ci
          sudo chown "$USER":"$USER" /mnt/mutualbackup-tor-ci
      - name: Prove onion-only seed recovery
        env:
          CARGO_INCREMENTAL: 0
          CARGO_PROFILE_DEV_DEBUG: 0
          CARGO_PROFILE_TEST_DEBUG: 0
          MUTUALBACKUP_REFLINK_TEST_ROOT: /mnt/mutualbackup-tor-ci
        run: >-
          nix develop .#private-tor -c bash
          scripts/private-tor-acceptance.sh
      - name: Unmount disposable filesystem
        if: always()
        run: |
          if mountpoint -q /mnt/mutualbackup-tor-ci; then
            sudo umount /mnt/mutualbackup-tor-ci
          fi
