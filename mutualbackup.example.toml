# Example configuration for one normal MutualBackup node.
# This file is human-owned; MutualBackup never creates or edits it.
# Relative paths are resolved relative to this file.

# Private local state. `mutualbackup init --data-dir ...` creates its public
# identity manifest; the daemon later creates its encrypted databases here.
data_dir = ".mutualbackup/node/state"

# Optional unattended auto-unlock. Omit this field to start locked and unlock
# through the CLI. Keep the file private and retain a genuinely offline copy.
seed_file = ".mutualbackup/offline/node.seed"

# Each daemon on a host needs its own Unix control socket.
control_socket = ".mutualbackup/node/run/control.sock"

# Guild members must use distinct, truthful failure-domain labels.
failure_domain = "host-a/disk-a"

# Maximum locally stored parity: 10 GiB.
parity_budget_bytes = 10737418240

# Optional independent parity filesystems. Each directory receives a signed
# volume manifest and its own SQLCipher database. An absent configured volume
# is reported offline and is never interpreted as empty. When omitted, parity
# remains beside control.db for a single-volume installation.
# parity_volumes = ["/srv/mutualbackup-a", "/srv/mutualbackup-b"]
# Reserve per-volume space for repair, migration, and garbage collection. The
# default is 5% of the budget, capped at 128 MiB.
# parity_headroom_bytes = 134217728

# Keep this many committed snapshots for each guild member. Retirement is
# certified in a checkpoint; collection waits for a later checkpoint.
retention_revisions = 30

# Automatic backup is opt-in. Events only reset the quiet timer; every admitted
# run performs an authoritative full scan and immutable capture.
automatic_backup = false
backup_quiet_seconds = 300
backup_minimum_interval_seconds = 3600
full_reconcile_interval_seconds = 86400
daily_backup_limit = 24
daily_backup_byte_limit = 107374182400

# Verify all assigned shards, scrub local parity databases, and attempt repairs.
audit_interval_seconds = 21600

# QUIC uses UDP. The external address below makes this example reachable only
# from this same host; replace it with a genuinely reachable address for peers
# on other machines.
p2p_listen_addresses = ["/ip4/0.0.0.0/udp/44000/quic-v1"]
p2p_external_addresses = ["/ip4/127.0.0.1/udp/44000/quic-v1"]

# Entries here are full multiaddresses ending in `/p2p/PEER_ID`.
p2p_bootstrap_addresses = []
p2p_relay_addresses = []

# Relay service is opt-in and admits only active members of this node's guild.
enable_relay_server = false

# DCUtR upgrades relay circuits to direct QUIC when both peers can punch through.
enable_hole_punching = true

# Opt in to automatic PCP, NAT-PMP, or UPnP mapping of the one IPv4 QUIC
# listener. Leave this false when port forwarding is managed externally.
enable_port_mapping = false

# Disable only for static/server-only deployments which deliberately do not
# bootstrap, publish, or refresh through the DHT. The node still serves DHT
# and application requests. Normal nodes should leave this true.
enable_dht_maintenance = true

# Start an onion service and use it automatically when direct/relay paths fail.
# Other values are "prefer-tor", "require-tor", and "disable-tor".
tor_mode = "auto"
# tor_state_dir = "./state/tor/state"
# tor_cache_dir = "./state/tor/cache"
# arti_config_file = "./arti.toml"

# Bound established libp2p sessions and concurrent peer workers.
max_connections = 32
