[workspace]
members = [
    "crates/mb-core",
    "crates/mb-store",
    "crates/mb-node",
    "cmd/mutualbackup",
    "vendor/libp2p-relay",
    "vendor/libp2p-request-response",
    "vendor/portmapper",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.91"

[workspace.dependencies]
anyhow = "1.0"
arti-client = { version = "=0.46.0", default-features = false, features = ["compression", "ephemeral-keystore", "experimental-api", "onion-service-client", "onion-service-service", "rustls", "tokio"] }
argon2 = { version = "0.5", features = ["zeroize"] }
bip39 = { version = "=2.2.2", features = ["rand", "zeroize"] }
blake3 = "1.8"
chacha20 = "0.9"
chacha20poly1305 = "0.10"
cbor4ii = { version = "=0.3.3", features = ["serde1", "use_std"] }
cddl-cat = "=0.7.1"
clap = { version = "4.5", features = ["derive"] }
conf = "=0.4.5"
data-encoding = "2.9"
ed25519-dalek = { version = "2.2", features = ["rand_core", "serde"] }
futures = "0.3"
filetime = "0.2"
fs2 = "0.4"
hex = "0.4"
hkdf = "0.12"
libc = "0.2"
libp2p = { version = "0.56.0", default-features = false, features = ["autonat", "cbor", "dcutr", "identify", "kad", "macros", "noise", "ping", "quic", "relay", "request-response", "serde", "tokio", "yamux"] }
libp2p-identity = { version = "0.2", features = ["ed25519", "peerid"] }
notify = "8.2"
postcard = { version = "1.1", features = ["alloc", "use-std"] }
portmapper = { version = "=0.19.1", default-features = false }
rand = "0.8"
reed-solomon-erasure = "6.0"
rpassword = "=7.5.4"
rusqlite = { version = "0.37", features = ["blob", "bundled-sqlcipher-vendored-openssl"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
sha3 = "0.10"
tempfile = "3.21"
thiserror = "2.0"
tokio = { version = "1.47", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
toml = "0.9"
tor-config = "=0.46.0"
tor-config-path = "=0.46.0"
tor-cell = "=0.46.0"
tor-hscrypto = "=0.46.0"
tor-hsservice = "=0.46.0"
tor-keymgr = "=0.46.0"
tor-llcrypto = "=0.46.0"
tor-proto = "=0.46.0"
tor-rtcompat = { version = "=0.46.0", default-features = false, features = ["rustls", "tokio"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = { version = "1.18", features = ["serde", "v4"] }
walkdir = "2.5"
x25519-dalek = { version = "2.0", features = ["serde", "static_secrets"] }
zeroize = { version = "1.8", features = ["derive"] }
zxcvbn = { version = "=3.1.1", default-features = false }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

[patch.crates-io]
# rust-libp2p 0.56 does not expose the connection that owns a relay-v2
# reservation.  The local patch adds that ID to reservation lifecycle events
# so the node can fence only the owning connection during session collapse.
libp2p-relay = { path = "vendor/libp2p-relay" }
# Application transport policy needs to keep relay-reservation connections
# alive while choosing the exact established connection for each request.
libp2p-request-response = { path = "vendor/libp2p-request-response" }
# Mapping shutdown must settle and release leases that were granted while an
# acquisition task was still waiting to be consumed by the service.
portmapper = { path = "vendor/portmapper" }
