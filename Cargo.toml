[workspace]
members = [
    "crates/mb-core",
    "crates/mb-store",
    "crates/mb-node",
    "cmd/mutualbackup",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.88"

[workspace.dependencies]
anyhow = "1.0"
argon2 = { version = "0.5", features = ["zeroize"] }
bip39 = { version = "=2.2.2", features = ["rand", "zeroize"] }
blake3 = "1.8"
chacha20 = "0.9"
chacha20poly1305 = "0.10"
cbor4ii = { version = "=0.3.3", features = ["serde1", "use_std"] }
cddl-cat = "=0.7.1"
clap = { version = "4.5", features = ["derive"] }
data-encoding = "2.9"
ed25519-dalek = { version = "2.2", features = ["rand_core", "serde"] }
futures = "0.3"
filetime = "0.2"
fs2 = "0.4"
hex = "0.4"
hkdf = "0.12"
libc = "0.2"
libp2p = { version = "0.56.0", default-features = false, features = ["autonat", "cbor", "dcutr", "identify", "kad", "macros", "noise", "ping", "quic", "relay", "request-response", "serde", "tokio", "yamux"] }
libp2p-identity = { version = "0.2", features = ["ed25519", "peerid"] }
notify = "8.2"
postcard = { version = "1.1", features = ["alloc", "use-std"] }
rand = "0.8"
reed-solomon-erasure = "6.0"
rpassword = "=7.5.4"
rusqlite = { version = "0.37", features = ["blob", "bundled-sqlcipher-vendored-openssl"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
sha3 = "0.10"
tempfile = "3.21"
thiserror = "2.0"
tokio = { version = "1.47", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = { version = "1.18", features = ["serde", "v4"] }
walkdir = "2.5"
x25519-dalek = { version = "2.0", features = ["serde", "static_secrets"] }
zeroize = { version = "1.8", features = ["derive"] }
zxcvbn = { version = "=3.1.1", default-features = false }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
